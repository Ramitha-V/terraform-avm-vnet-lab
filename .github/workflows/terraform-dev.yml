name: Terraform AVM VNet - Dev

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-vnet-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infra/dev
  TERRAFORM_VERSION: 1.10.5

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev-plan
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure context
        run: az account show --query "{subscription:name, id:id, tenant:tenantId}" -o json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform -chdir=$TF_WORKING_DIR fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=$TF_WORKING_DIR init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform validate
        run: terraform -chdir=$TF_WORKING_DIR validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --chdir=$TF_WORKING_DIR --init
          tflint --chdir=$TF_WORKING_DIR --format compact

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: infra/dev
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: infra/dev/.terraform

      - name: Terraform plan
        run: |
          terraform -chdir=$TF_WORKING_DIR plan \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan

      - name: Write plan summary
        run: |
          {
            echo "## Terraform Plan"
            echo '```'
            terraform -chdir=$TF_WORKING_DIR show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 2
          if-no-files-found: error

  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: dev-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=$TF_WORKING_DIR init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply approved plan
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan

      - name: Terraform outputs
        run: |
          {
            echo "## Terraform Outputs"
            echo '```'
            terraform -chdir=$TF_WORKING_DIR output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
